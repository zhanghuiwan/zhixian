name: zhixian

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-zhixian}
      POSTGRES_USER: ${POSTGRES_USER:-zhixian}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-zhixian} -d ${POSTGRES_DB:-zhixian}"]
      interval: 10s
      timeout: 5s
      retries: 8
    networks: [internal]

  api:
    build: ./apps/api
    restart: unless-stopped
    environment:
      APP_NAME: 知闲 API
      ENVIRONMENT: production
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-zhixian}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-zhixian}
      SECRET_KEY: ${SECRET_KEY:?SECRET_KEY is required}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-10080}
      CREATE_DEMO_USER: ${CREATE_DEMO_USER:-false}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost}
      WEB_CONCURRENCY: ${WEB_CONCURRENCY:-2}
    volumes:
      - ./data/uploads:/data/uploads
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health')"]
      interval: 15s
      timeout: 5s
      retries: 5
    networks: [internal]

  web:
    build:
      context: ./apps/web
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-/api/v1}
        NEXT_PUBLIC_DEMO_MODE: ${NEXT_PUBLIC_DEMO_MODE:-false}
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    networks: [internal]

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on: [web]
    networks: [internal]

volumes:
  postgres_data:

networks:
  internal:
    driver: bridge
